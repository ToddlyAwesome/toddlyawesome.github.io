<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toddly — Y2K Icon Parade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #141115; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #canvas { width: 800px; height: 800px; position: absolute;
            top: 50%; left: 50%;
            transform-origin: center center;
            overflow: hidden; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas"><div id="root" style="position:absolute;inset:0;"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">

// Fill the frame — scale to cover (like background-size: cover)
function fit() {
  const c = document.getElementById('canvas');
  const s = Math.max(window.innerWidth / 800, window.innerHeight / 800);
  c.style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', fit); fit();

// Brand palette — signature
const P = {
  ink: '#141115', inkHi: '#241820',
  plum: '#4c2b36', tan: '#8d6346',
  lime: '#c6f91f', butter: '#ddf45b',
  bone: '#f5f0e6',
};
const W = 800, H = 800;

function Sparkle({ size, color, opacity = 1 }) {
  const s = size;
  return (
    <g opacity={opacity}>
      <path d={`M 0 -${s} Q 0 -${s*0.18} ${s*0.18} 0 Q 0 ${s*0.18} 0 ${s} Q 0 ${s*0.18} -${s*0.18} 0 Q 0 -${s*0.18} 0 -${s} Z`} fill={color}/>
      <path d={`M -${s*0.7} 0 Q -${s*0.13} 0 0 ${s*0.13} Q 0 0 ${s*0.7} 0 Q ${s*0.13} 0 0 -${s*0.13} Q 0 0 -${s*0.7} 0 Z`} fill={color} opacity="0.85"/>
    </g>
  );
}

function MeshGrid({ t }) {
  const cells = 16, lines = [];
  const wave = (x, y) => Math.sin((x + t * 30) * 0.012) * 12 + Math.cos((y + t * 20) * 0.014) * 8;
  for (let i = 0; i <= cells; i++) {
    const pts = [];
    for (let j = 0; j <= cells; j++) {
      const x = (i / cells) * 360, y = (j / cells) * 240;
      pts.push(`${x + wave(x, y)},${y + wave(y + 100, x)}`);
    }
    lines.push(<polyline key={`v${i}`} points={pts.join(' ')} fill="none" stroke={P.lime} strokeWidth="0.7" opacity="0.55"/>);
  }
  for (let j = 0; j <= cells; j++) {
    const pts = [];
    for (let i = 0; i <= cells; i++) {
      const x = (i / cells) * 360, y = (j / cells) * 240;
      pts.push(`${x + wave(x, y)},${y + wave(y + 100, x)}`);
    }
    lines.push(<polyline key={`h${j}`} points={pts.join(' ')} fill="none" stroke={P.lime} strokeWidth="0.7" opacity="0.55"/>);
  }
  return <svg width={W} height={H} style={{ position: 'absolute', top: -20, left: -40 }}><g>{lines}</g></svg>;
}

function Sparkles({ t }) {
  const list = [
    { x: 215, y: 280, size: 28, color: P.lime,   phase: 0,    spin: 18 },
    { x: 590, y: 260, size: 36, color: P.lime,   phase: 1.7,  spin: -12 },
    { x: 700, y: 540, size: 22, color: P.bone,   phase: 2.4,  spin: 22 },
    { x: 130, y: 600, size: 18, color: P.butter, phase: 0.9,  spin: -25 },
    { x: 450, y: 405, size: 14, color: P.bone,   phase: 3.2,  spin: 30 },
    { x: 660, y: 730, size: 12, color: P.lime,   phase: 4.1,  spin: -18 },
    { x: 305, y: 525, size: 10, color: P.butter, phase: 1.3,  spin: 40 },
    { x: 540, y: 195, size: 8,  color: P.bone,   phase: 5.0,  spin: 60 },
    { x: 95,  y: 460, size: 9,  color: P.lime,   phase: 2.8,  spin: -50 },
  ];
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      {list.map((s, i) => {
        const pulse = 0.85 + 0.25 * Math.sin(t * 2.4 + s.phase);
        const op    = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(t * 1.8 + s.phase));
        const rot   = s.spin * Math.sin(t * 0.5 + s.phase);
        return (
          <g key={i} transform={`translate(${s.x} ${s.y}) scale(${pulse}) rotate(${rot})`}>
            <Sparkle size={s.size} color={s.color} opacity={op}/>
          </g>
        );
      })}
    </svg>
  );
}

function WireSphere({ t, cx, cy, r }) {
  const spin = (t * 30) % 360;
  const a = -spin * 0.7 * Math.PI / 180;
  const sx = Math.cos(a) * r * 1.45;
  const sy = Math.sin(a) * r * 0.4;
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      <g transform={`translate(${cx} ${cy})`}>
        {[-0.8, -0.5, -0.2, 0.1, 0.4, 0.7].map((p, i) => (
          <ellipse key={i} cx={0} cy={p * r}
                   rx={r * Math.sqrt(1 - p*p)} ry={Math.abs(p) * 12 + 2}
                   fill="none" stroke={P.bone} strokeWidth="0.9" opacity="0.7"/>
        ))}
        <circle cx={0} cy={0} r={r} fill="none" stroke={P.bone} strokeWidth="1.1"/>
        <g transform={`rotate(${spin})`}>
          {[0, 22.5, 45, 67.5, 90, 112.5, 135, 157.5].map((deg, i) => {
            const rad = deg * Math.PI / 180;
            const rx = Math.abs(Math.cos(rad)) * r;
            return <ellipse key={i} cx={0} cy={0} rx={rx} ry={r} fill="none" stroke={P.bone} strokeWidth="0.8" opacity="0.55"/>;
          })}
        </g>
        <ellipse cx={0} cy={0} rx={r * 1.45} ry={r * 0.4}
                 fill="none" stroke={P.lime} strokeWidth="1.5"
                 transform={`rotate(${-spin * 0.7})`}/>
        <ellipse cx={0} cy={0} rx={r * 1.45} ry={r * 0.4}
                 fill="none" stroke={P.lime} strokeWidth="0.6"
                 strokeDasharray="2 4"
                 transform={`rotate(${-spin * 0.7 + 8})`} opacity="0.6"/>
        <g transform={`translate(${sx} ${sy})`}><Sparkle size={10} color={P.lime}/></g>
      </g>
    </svg>
  );
}

function OvalStack({ t, cx, cy }) {
  const count = 6;
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      <g transform={`translate(${cx} ${cy}) rotate(${-12 + Math.sin(t * 0.4) * 4})`}>
        {Array.from({ length: count }, (_, i) => {
          const dx = (i - (count-1)/2) * 22;
          const phase = t * 1.4 + i * 0.45;
          const sway = Math.sin(phase) * 4;
          const op = 0.4 + 0.4 * (0.5 + 0.5 * Math.cos(phase));
          return (
            <ellipse key={i} cx={dx + sway} cy={0} rx={48} ry={22}
              fill="none" stroke={i === 0 ? P.lime : P.bone}
              strokeWidth="1.1" opacity={op}/>
          );
        })}
      </g>
    </svg>
  );
}

function Swoosh({ t, cx, cy }) {
  const a = t * 0.5;
  const x = cx + Math.sin(a) * 60;
  const y = cy + Math.sin(a * 2) * 30;
  const rot = Math.sin(a) * 18;
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      <g transform={`translate(${x} ${y}) rotate(${rot})`}>
        <path d="M -120 0 Q -90 -55 -10 -55 Q 60 -55 120 0 Q 70 -28 -10 -28 Q -90 -28 -120 0 Z" fill={P.lime}/>
        <g transform="translate(130 6)"><Sparkle size={12} color={P.lime}/></g>
        <g transform="translate(-150 -2)"><Sparkle size={6} color={P.lime} opacity={0.6}/></g>
      </g>
    </svg>
  );
}

function OrbitRing({ t, cx, cy, rx, ry }) {
  const rot = -14 + Math.sin(t * 0.3) * 4;
  const a1 = t * 0.7, a2 = a1 + Math.PI;
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      <g transform={`translate(${cx} ${cy}) rotate(${rot})`}>
        <ellipse cx={0} cy={0} rx={rx} ry={ry} fill="none" stroke={P.bone} strokeWidth="1.5"/>
        <ellipse cx={0} cy={0} rx={rx} ry={ry} fill="none" stroke={P.lime} strokeWidth="0.6"
                 strokeDasharray="3 5" opacity="0.7"/>
        <Sparkle size={26} color={P.lime}/>
        <g transform={`translate(${Math.cos(a1) * rx} ${Math.sin(a1) * ry})`}><Sparkle size={8} color={P.bone}/></g>
        <g transform={`translate(${Math.cos(a2) * rx} ${Math.sin(a2) * ry})`}><Sparkle size={6} color={P.bone} opacity={0.7}/></g>
      </g>
    </svg>
  );
}

function ShootingStar({ t, cx, cy }) {
  const drift = Math.sin(t * 0.6) * 12;
  return (
    <svg width={W} height={H} style={{ position: 'absolute', inset: 0 }}>
      <g transform={`translate(${cx + drift} ${cy})`}>
        <path d="M 0 0 L -120 -8 L -180 -3 L -160 0 L -180 3 L -120 8 Z" fill={P.bone} opacity="0.9"/>
        <Sparkle size={32} color={P.bone}/>
        <circle cx={0} cy={0} r={3} fill={P.lime}/>
      </g>
    </svg>
  );
}

function Barcode({ t }) {
  const widths = [3, 1, 2, 4, 1, 3, 1, 1, 2, 1, 3, 4, 1, 2, 1, 3, 2, 1, 4, 1, 2, 3, 1, 1, 2, 4, 1, 3, 2, 1, 1, 3, 2, 4];
  let x = 0;
  const bars = [];
  widths.forEach((w, i) => {
    const op = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2 + i * 0.4));
    bars.push(<rect key={i} x={x} y={0} width={w} height={28} fill={P.bone} opacity={op}/>);
    x += w + 1;
  });
  return (
    <div style={{ position: 'absolute', left: 32, bottom: 28 }}>
      <svg width={x} height={48}>
        <g>{bars}</g>
        <text x={0} y={44} fontFamily="ui-monospace, monospace" fontSize="9"
              letterSpacing="0.18em" fill={P.bone} opacity="0.7">
          {`(00) ${Math.floor(t * 1000) % 1000000} ${Math.floor(t * 13) % 100}`}
        </text>
      </svg>
    </div>
  );
}

function Y2KLoop() {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    let raf, last = null;
    const step = (ts) => {
      if (last == null) last = ts;
      const dt = (ts - last) / 1000; last = ts;
      setT((x) => (x + dt) % 12);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);

  const bg = `radial-gradient(ellipse at 50% 55%, ${P.inkHi} 0%, ${P.ink} 70%, #000 100%)`;

  return (
    <div style={{ position: 'absolute', inset: 0, background: bg, overflow: 'hidden',
                  fontFamily: 'ui-monospace, "JetBrains Mono", monospace' }}>
      <MeshGrid t={t}/>
      <Sparkles t={t}/>
      <WireSphere t={t} cx={W*0.78} cy={H*0.30} r={75}/>
      <OvalStack t={t} cx={W*0.32} cy={H*0.22}/>
      <Swoosh t={t} cx={W*0.50} cy={H*0.50}/>
      <OrbitRing t={t} cx={W*0.55} cy={H*0.72} rx={170} ry={45}/>
      <ShootingStar t={t} cx={W*0.18} cy={H*0.85}/>
      <Barcode t={t}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Y2KLoop/>);
</script>

</body>
</html>
